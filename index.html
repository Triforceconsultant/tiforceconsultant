<script type="text/babel">
const {
  useState, useEffect, useRef, useMemo,
  Children, cloneElement, isValidElement, forwardRef
} = React;

/* ════════════════════════════════════
   CardSwap (from user — GSAP-powered)
════════════════════════════════════ */
const Card = forwardRef(({ customClass, ...rest }, ref) => (
  <div
    ref={ref}
    {...rest}
    className={[
      'absolute top-1/2 left-1/2 rounded-2xl overflow-hidden',
      customClass ?? '',
      rest.className ?? '',
    ].filter(Boolean).join(' ')}
    style={{
      border: '1px solid rgba(255,255,255,0.18)',
      transformStyle: 'preserve-3d',
      willChange: 'transform',
      backfaceVisibility: 'hidden',
      ...(rest.style ?? {}),
    }}
  />
));
Card.displayName = 'Card';

const makeSlot = (i, distX, distY, total) => ({
  x: i * distX, y: -i * distY, z: -i * distX * 1.5, zIndex: total - i,
});

const placeNow = (el, slot, skew) =>
  gsap.set(el, {
    x: slot.x, y: slot.y, z: slot.z,
    xPercent: -50, yPercent: -50,
    skewY: skew,
    transformOrigin: 'center center',
    zIndex: slot.zIndex,
    force3D: true,
  });

function CardSwap({
  width = 420, height = 290,
  cardDistance = 52, verticalDistance = 64,
  delay = 4000, pauseOnHover = true,
  onCardClick, skewAmount = 5,
  easing = 'elastic', children,
  containerStyle = {},
}) {
  const config = easing === 'elastic'
    ? { ease:'elastic.out(0.6,0.9)', durDrop:2, durMove:2, durReturn:2, promoteOverlap:0.9, returnDelay:0.05 }
    : { ease:'power1.inOut', durDrop:0.8, durMove:0.8, durReturn:0.8, promoteOverlap:0.45, returnDelay:0.2 };

  const childArr = useMemo(() => Children.toArray(children), [children]);
  const refs     = useMemo(() => childArr.map(() => React.createRef()), [childArr.length]);
  const order    = useRef(Array.from({ length: childArr.length }, (_, i) => i));
  const tlRef    = useRef(null);
  const intervalRef = useRef();
  const container   = useRef(null);

  useEffect(() => {
    const total = refs.length;
    refs.forEach((r, i) => placeNow(r.current, makeSlot(i, cardDistance, verticalDistance, total), skewAmount));

    const swap = () => {
      if (order.current.length < 2) return;
      const [front, ...rest] = order.current;
      const elFront = refs[front].current;
      const tl = gsap.timeline();
      tlRef.current = tl;

      tl.to(elFront, { y: '+=500', duration: config.durDrop, ease: config.ease });
      tl.addLabel('promote', `-=${config.durDrop * config.promoteOverlap}`);
      rest.forEach((idx, i) => {
        const el   = refs[idx].current;
        const slot = makeSlot(i, cardDistance, verticalDistance, refs.length);
        tl.set(el, { zIndex: slot.zIndex }, 'promote');
        tl.to(el, { x: slot.x, y: slot.y, z: slot.z, duration: config.durMove, ease: config.ease }, `promote+=${i * 0.15}`);
      });

      const backSlot = makeSlot(refs.length - 1, cardDistance, verticalDistance, refs.length);
      tl.addLabel('return', `promote+=${config.durMove * config.returnDelay}`);
      tl.call(() => { gsap.set(elFront, { zIndex: backSlot.zIndex }); }, undefined, 'return');
      tl.to(elFront, { x: backSlot.x, y: backSlot.y, z: backSlot.z, duration: config.durReturn, ease: config.ease }, 'return');
      tl.call(() => { order.current = [...rest, front]; });
    };

    swap();
    intervalRef.current = window.setInterval(swap, delay);

    if (pauseOnHover) {
      const node = container.current;
      const pause  = () => { tlRef.current?.pause(); clearInterval(intervalRef.current); };
      const resume = () => { tlRef.current?.play();  intervalRef.current = window.setInterval(swap, delay); };
      node.addEventListener('mouseenter', pause);
      node.addEventListener('mouseleave', resume);
      return () => {
        node.removeEventListener('mouseenter', pause);
        node.removeEventListener('mouseleave', resume);
        clearInterval(intervalRef.current);
      };
    }
    return () => clearInterval(intervalRef.current);
  }, [cardDistance, verticalDistance, delay, pauseOnHover, skewAmount, easing]);

  const rendered = childArr.map((child, i) =>
    isValidElement(child)
      ? cloneElement(child, {
          key: i, ref: refs[i],
          style: { width, height, ...(child.props.style ?? {}) },
          onClick: e => { child.props.onClick?.(e); onCardClick?.(i); },
        })
      : child
  );

  return (
    <div
      ref={container}
      style={{
        position: 'absolute', bottom: 0, right: 0, width, height,
        perspective: 900, overflow: 'visible',
        transform: 'translate(5%, 20%)',
        transformOrigin: 'bottom right',
        ...containerStyle,
      }}
    >
      {rendered}
    </div>
  );
}

function Button({ variant = 'default', size = '', href, children, className = '', onClick, type = 'button', disabled = false }) {
  const cls = `btn btn-${variant} ${size === 'sm' ? 'btn-sm' : ''} ${className}`.trim();
  if (href) return <a href={href} className={cls}>{children}</a>;
  return (
    <button
      className={cls} onClick={onClick} type={type} disabled={disabled}
      style={disabled ? {opacity:0.6,cursor:'not-allowed',pointerEvents:'none'} : {}}
    >{children}</button>
  );
}

      <polygon points="14,46 24,29 34,46" fill="#a1a1aa" opacity="0.55"/>
    </svg>
  );
}

function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } },
      { threshold: 0.1, rootMargin: '0px 0px -32px 0px' }
    );
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return ref;
}

        <nav style={{alignItems:'center',gap:28}} className="hidden md:flex">

            <a key={h} href={h} className="nav-link">{l}</a>
          ))}
          <Button size="sm" onClick={onEnquiry}>Get in Touch</Button>
        </nav>

        <button className="md:hidden" onClick={() => setOpen(!open)}
          style={{padding:8,border:'1px solid #e4e4e7',borderRadius:6,background:'transparent',cursor:'pointer',lineHeight:0}}>
          <svg width="16" height="16" fill="none" stroke="#52525b" viewBox="0 0 24 24">

              : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/>}
          </svg>
        </button>
      </div>

      {open && (
        <div style={{borderTop:'1px solid #f4f4f5',background:'#fff',padding:'16px 24px 20px',display:'flex',flexDirection:'column',gap:14}}>
          {[['#services','Services'],['#why','Why Us'],['#contact','Contact']].map(([h,l]) => (
            <a key={h} href={h} className="nav-link" style={{fontSize:14}} onClick={() => setOpen(false)}>{l}</a>
          ))}
          <Button size="sm" className="self-start" onClick={() => { setOpen(false); onEnquiry(); }}>Get in Touch</Button>
        </div>
      )}
    </header>
  );
}

       * Web3Forms — no account needed, 250 emails/month free.
       * ONE-TIME SETUP (2 minutes):
       *   1. Go to https://web3forms.com
       *   2. Enter: bindu@triforceconsultant.com
       *   3. Check that inbox — copy the access key from the email received
       *   4. Paste it below replacing YOUR_ACCESS_KEY
       */
      const res  = await fetch('https://api.web3forms.com/submit', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          access_key:  'YOUR_ACCESS_KEY',
          subject:     'New Website Enquiry - TRIFORCE Consulting',
          from_name:   'TRIFORCE Website',
          replyto:     email,
          phone,
          email,
          requirement,
        }),
      });
      const data = await res.json();
      setStatus(data.success ? 'success' : 'error');
    } catch {
      setStatus('error');
    }
  };

  const LabelStyle = {
    fontSize: 10.5, fontWeight: 600, color: '#52525b',
    textTransform: 'uppercase', letterSpacing: '0.09em',
    display: 'block', marginBottom: 6,
  };

  return (
    <div
      className="modal-overlay"
      style={{
        position:'fixed', inset:0, zIndex:200,
        background:'rgba(9,9,11,0.45)', backdropFilter:'blur(6px)',
        display:'flex', alignItems:'center', justifyContent:'center',
        padding:'20px',
      }}
      onClick={e => e.target === e.currentTarget && onClose()}
    >
      <div className="modal-box" style={{
        background:'#fff', borderRadius:12, border:'1px solid #e4e4e7',
        padding:'32px', width:'100%', maxWidth:420,
        boxShadow:'0 24px 64px rgba(0,0,0,0.14)', position:'relative',
      }}>

        {/* close button */}
        <button onClick={onClose} style={{
          position:'absolute', top:14, right:14, background:'transparent',
          border:'1px solid #e4e4e7', borderRadius:6, padding:'5px 8px',
          cursor:'pointer', lineHeight:0,
        }}>
          <svg width="13" height="13" fill="none" stroke="#71717a" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>

        {status === 'success' ? (
          <div style={{textAlign:'center', padding:'12px 0 8px'}}>
            <div style={{
              width:48, height:48, borderRadius:'50%', background:'#f4f4f5',
              border:'1px solid #e4e4e7', display:'flex', alignItems:'center',
              justifyContent:'center', margin:'0 auto 16px',
            }}>
              <svg width="20" height="20" fill="none" stroke="#3f3f46" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
            <h3 style={{fontSize:17,fontWeight:700,color:'#09090b',marginBottom:8,letterSpacing:'-0.02em'}}>Enquiry Received</h3>
            <p style={{fontSize:13.5,color:'#71717a',lineHeight:1.65,marginBottom:22}}>
              We have received your enquiry and will be in touch with you shortly.
            </p>
            <Button onClick={onClose}>Close</Button>
          </div>
        ) : (
          <>
            <div style={{marginBottom:22}}>
              <TriforceMark size={22} />
              <h3 style={{fontSize:17,fontWeight:700,color:'#09090b',marginTop:12,marginBottom:4,letterSpacing:'-0.02em'}}>
                Get in Touch
              </h3>
              <p style={{fontSize:13,color:'#71717a',lineHeight:1.55}}>
                Share your details and we will reach out to you promptly.
              </p>
            </div>

            <form onSubmit={handleSubmit} style={{display:'flex',flexDirection:'column',gap:14}}>
              <div>
                <label style={LabelStyle}>
                  Phone Number <span style={{color:'#a1a1aa',fontWeight:400}}>*</span>
                </label>
                <input
                  type="tel" required
                  value={phone} onChange={e => setPhone(e.target.value)}
                  placeholder="+91 98765 43210"
                  className="inp"
                />
              </div>

              <div>
                <label style={LabelStyle}>
                  Email Address <span style={{color:'#a1a1aa',fontWeight:400}}>*</span>
                </label>
                <input
                  type="email" required
                  value={email} onChange={e => setEmail(e.target.value)}
                  placeholder="you@company.com"
                  className="inp"
                />
              </div>

              <div>
                <label style={LabelStyle}>
                  Requirement <span style={{color:'#a1a1aa',fontWeight:400}}>*</span>
                </label>
                <textarea
                  required
                  value={requirement} onChange={e => setRequirement(e.target.value)}
                  placeholder="Briefly describe what you are looking for..."
                  rows={4}
                  className="inp"
                  style={{resize:'vertical', minHeight:90, lineHeight:1.6}}
                />
              </div>

              {status === 'error' && (
                <p style={{
                  fontSize:12.5, color:'#dc2626', margin:0,
                  padding:'8px 12px', background:'#fef2f2',
                  borderRadius:6, border:'1px solid #fecaca',
                }}>
                  Something went wrong. Please try again or call us at +91 99958 28419.
                </p>
              )}

              <Button type="submit" disabled={status === 'loading'}>
                {status === 'loading' ? 'Sending...' : 'Send Enquiry'}
              </Button>
            </form>
          </>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════
   App
════════════════════════════════════ */
function App() {
  const [popupOpen, setPopupOpen] = useState(false);
  return (
    <>
      <Nav onEnquiry={() => setPopupOpen(true)} />
      <main>
        <Hero />
        <Services />
        <Needs />
        <Why />
        <Contact onEnquiry={() => setPopupOpen(true)} />
      </main>
      <Footer />
      {popupOpen && <ContactPopup onClose={() => setPopupOpen(false)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
